<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci — Atelier Altitude</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://github.com/sbrum05/atelieraltitude/blob/main/favicon-256x256.png?raw=true">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Darker+Grotesque:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VFH20TKKTS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VFH20TKKTS');
  </script>
  <style>
    :root{--cream:#F5F0E8;--charcoal:#1C1A17;--brown:#3D2B1F;--gold:#C9A96E;--dark-bg:#13110E;--stone:#8C7B6E;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{background-color:var(--dark-bg);color:var(--cream);font-family:'Darker Grotesque',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.4;}

    .bg-image{position:fixed;inset:0;background-image:url('https://raw.githubusercontent.com/sbrum05/atelieraltitude/main/grande%20table%201.jpg');background-size:cover;background-position:center 30%;opacity:0.08;z-index:0;}

    .card{position:relative;z-index:1;max-width:560px;opacity:0;transform:translateY(30px);animation:fadeUp 0.9s ease 0.2s forwards;}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

    .icon-wrap{width:72px;height:72px;border:1px solid rgba(201,169,110,0.4);display:flex;align-items:center;justify-content:center;margin:0 auto 2.5rem;}
    .icon-wrap svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

    .label{font-size:0.85rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;display:flex;align-items:center;justify-content:center;gap:0.8rem;}
    .label::before,.label::after{content:'';display:block;width:24px;height:1px;background:var(--gold);}

    h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,5vw,3.8rem);font-weight:300;line-height:1.1;color:var(--cream);margin-bottom:1.5rem;}
    h1 em{font-style:italic;color:var(--gold);}

    p{font-size:1.2rem;line-height:1.85;color:#BDB0A6;margin-bottom:2.5rem;font-weight:400;}

    .divider{width:40px;height:1px;background:rgba(201,169,110,0.3);margin:0 auto 2.5rem;}

    .contact-line{font-size:1rem;color:var(--stone);margin-bottom:2.5rem;}
    .contact-line a{color:var(--gold);text-decoration:none;}
    .contact-line a:hover{text-decoration:underline;}

    .btn{display:inline-block;background:var(--gold);color:var(--dark-bg);font-family:'Darker Grotesque',sans-serif;font-size:0.9rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;text-decoration:none;padding:1rem 2.5rem;transition:background 0.3s;}
    .btn:hover{background:#C4855A;}

    .footer-logo{margin-top:4rem;font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:300;letter-spacing:0.2em;text-transform:uppercase;color:rgba(245,240,232,0.3);}
    .footer-logo span{color:rgba(201,169,110,0.4);}
  </style>
</head>
<body>
  <div class="bg-image"></div>

  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <p class="label">Message envoyé</p>

    <h1>Merci pour<br><em>votre message</em></h1>

    <p>Votre demande a bien été reçue. Nous revenons vers vous dans les meilleurs délais pour discuter de votre projet.</p>

    <div class="divider"></div>

    <p class="contact-line">Une question urgente ? <a href="mailto:contact@atelieraltitude.fr">contact@atelieraltitude.fr</a> · <a href="tel:+33633705523">06 33 70 55 23</a></p>

    <a href="https://atelieraltitude.fr" class="btn">Retour au site</a>

    <div class="footer-logo">Atelier <span>Altitude</span></div>
  </div>
</body>
</html>
